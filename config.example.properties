# =====================================================================================
# SIGE - plantilla de configuracion (UNICO archivo de configuracion)
#
# Copia este archivo como "config.properties" en la carpeta desde donde ejecutas SIGE
# (o junto al .jar) y escribe tus datos reales. config.properties esta en .gitignore y
# NUNCA debe subirse a GitHub. En un servidor (Render) usa variables de entorno en su lugar
# (SIGE_DB_URL, SIGE_DB_USER, SIGE_DB_PASSWORD, SIGE_2FA_ENCRYPTION_KEY...): ganan sobre este archivo.
# =====================================================================================

# --- Base de datos MySQL ---
# Local:
# db.url=jdbc:mysql://localhost:3306/sige_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santo_Domingo
# Aiven (nube):
# db.url=jdbc:mysql://SERVIDOR:PUERTO/sige_db?sslMode=REQUIRED&serverTimezone=America/Santo_Domingo
# MyASP.NET (segun la rubrica):
# db.url=jdbc:mysql://SERVIDOR:3306/BASE?useSSL=true&serverTimezone=America/Santo_Domingo
db.url=jdbc:mysql://SERVIDOR:3306/BASE?useSSL=true&serverTimezone=America/Santo_Domingo
db.user=TU_USUARIO_MYSQL
db.password=TU_CLAVE_MYSQL

# --- Clave AES-256 en Base64 (32 bytes) que cifra los secretos 2FA ---
# Debe ser la misma que ya uso la base de datos al activar el 2FA; si cambia, los 2FA existentes
# dejan de funcionar. Generala en PowerShell (ver LEEME.md). No la compartas ni la subas a Git.
2fa.encryption-key=

# --- Registro publico ---
# true (por defecto): las cuentas nuevas quedan pendientes hasta que un administrador las apruebe.
# false: el registro es inmediato (util para demostraciones).
# registro.requiere.aprobacion=true

# --- Correo (SMTP) opcional ---
# Solo remitentes personales Gmail/Googlemail o Microsoft (Outlook/Hotmail/Live/MSN); no usar correo
# institucional. Gmail: smtp.gmail.com, puerto 587 y contrasena de aplicacion (no la contrasena normal).
# Nota: Render bloquea los puertos SMTP (25, 465 y 587) en su plan gratis; alli el aviso por correo no sale.
# mail.smtp.host=smtp.gmail.com
# mail.smtp.port=587
# mail.smtp.auth=true
# mail.smtp.user=TU_CUENTA_PERSONAL@gmail.com
# mail.smtp.password=TU_CONTRASENA_DE_APLICACION
# mail.smtp.from=TU_CUENTA_PERSONAL@gmail.com
# mail.smtp.starttls.enable=true
# mail.smtp.ssl.enable=false
