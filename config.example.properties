# Plantilla de conexion a MySQL (nube).
# Copia este archivo como "config.properties" JUNTO AL .jar (o en la carpeta desde donde
# ejecutas la app) y escribe tus datos reales. config.properties esta en .gitignore y
# NO debe subirse a GitHub.

# --- MyASP.NET (segun la rubrica) ---
# db.url=jdbc:mysql://SERVIDOR:3306/BASE?useSSL=true&serverTimezone=America/Santo_Domingo
# --- Aiven (si se usa) ---
# db.url=jdbc:mysql://SERVIDOR:PUERTO/sige_db?sslMode=REQUIRED&serverTimezone=America/Santo_Domingo
db.url=jdbc:mysql://SERVIDOR:3306/BASE?useSSL=true&serverTimezone=America/Santo_Domingo
db.user=TU_USUARIO_MYSQL
db.password=TU_CLAVE_MYSQL

# Clave AES-256 en Base64 (32 bytes) que cifra los secretos 2FA. Debe ser la misma que ya
# uso la base de datos al activar el 2FA; si cambia, los 2FA existentes dejan de funcionar.
2fa.encryption-key=
