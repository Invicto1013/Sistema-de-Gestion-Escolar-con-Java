    <!-- estudiante derecha -->
    <g transform="translate(332 224)">
      <rect x="-9" y="26" width="7" height="22" rx="3" fill="#17324d"/><rect x="2" y="26" width="7" height="22" rx="3" fill="#17324d"/>
      <rect x="-12" y="2" width="24" height="30" rx="8" fill="#0f766e"/>
      <circle cx="0" cy="-8" r="11" fill="#c98763"/><path d="M-12-6a12 12 0 0 1 24 0v6c0-8-5-11-12-11s-12 3-12 11z" fill="#17324d"/>
      <rect x="-20" y="8" width="10" height="16" rx="3" fill="#ef6530"/>
    </g>
    <!-- lápiz -->
    <g transform="translate(396 188) rotate(22)">
      <rect x="0" y="0" width="12" height="52" rx="2" fill="#f2b84b"/>
      <path d="M0 52h12l-6 14z" fill="#ffe3b0"/><path d="M3.8 60h4.4L6 66z" fill="#17324d"/>
