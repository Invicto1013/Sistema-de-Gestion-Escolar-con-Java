<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-label="Escuela con estudiantes y árboles">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe9f5"/><stop offset="1" stop-color="#eef8f5"/></linearGradient>
    <linearGradient id="pasto" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a9a8c"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <clipPath id="marco"><rect width="480" height="280" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#marco)">
    <rect width="480" height="280" fill="url(#cielo)"/>
    <!-- sol -->
    <circle cx="410" cy="56" r="40" fill="#ffe2d2" opacity=".8"/><circle cx="410" cy="56" r="24" fill="#ef6530"/>
    <!-- nubes -->
    <g fill="#fff" opacity=".95">
      <ellipse cx="86" cy="52" rx="34" ry="12"/><ellipse cx="108" cy="44" rx="22" ry="12"/><ellipse cx="68" cy="46" rx="18" ry="10"/>
      <ellipse cx="318" cy="36" rx="28" ry="9"/><ellipse cx="336" cy="30" rx="16" ry="9"/>
    </g>
    <!-- aves -->
