      <!-- puerta -->
      <path d="M222 224v-52a18 18 0 0 1 36 0v52z" fill="#0f766e" stroke="#17324d" stroke-width="3"/>
      <path d="M240 156v68" stroke="#17324d" stroke-width="2.5"/>
