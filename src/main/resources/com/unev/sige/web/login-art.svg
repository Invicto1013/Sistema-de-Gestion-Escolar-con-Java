      <path d="M180 62q6-8 12 0q6-8 12 0"/><path d="M214 44q5-6 10 0q5-6 10 0"/>
    </g>
    <!-- colinas -->
    <path d="M0 196c60-34 130-40 200-20s150 30 280-6v110H0z" fill="#bfe0da"/>
    <!-- arboles de fondo -->
    <g>
