      <rect x="416" y="166" width="6" height="34" fill="#17324d"/><circle cx="419" cy="154" r="26" fill="#2a9a8c"/><circle cx="432" cy="166" r="14" fill="#3fb0a0"/>
    </g>
    <!-- escuela -->
    <g>
      <rect x="118" y="128" width="244" height="96" fill="#ffffff" stroke="#17324d" stroke-width="4"/>
      <rect x="196" y="100" width="88" height="124" fill="#ffffff" stroke="#17324d" stroke-width="4"/>
      <path d="M184 102L240 64l56 38z" fill="#17324d"/>
      <path d="M106 130L148 108h184l42 22z" fill="#17324d" opacity=".0"/>
      <rect x="112" y="122" width="256" height="10" rx="3" fill="#17324d"/>
      <circle cx="240" cy="88" r="11" fill="#fff"/><path d="M240 81v7h6" stroke="#17324d" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M240 64V34" stroke="#17324d" stroke-width="4" stroke-linecap="round"/><path d="M240 34h28l-9 8 9 8h-28z" fill="#ef6530"/>
