      <rect x="12" y="-4" width="46" height="13" rx="3" fill="#f2b84b"/>
    </g>
    <!-- estudiante izquierda -->
    <g transform="translate(150 226)">
      <rect x="-9" y="26" width="7" height="22" rx="3" fill="#17324d"/><rect x="2" y="26" width="7" height="22" rx="3" fill="#17324d"/>
      <rect x="-12" y="2" width="24" height="30" rx="8" fill="#ef6530"/>
      <circle cx="0" cy="-8" r="11" fill="#e0a37a"/><path d="M-11-9a11 11 0 0 1 22 0c-5-5-17-5-22 0z" fill="#17324d"/>
      <rect x="9" y="8" width="10" height="16" rx="3" fill="#f2b84b"/>
