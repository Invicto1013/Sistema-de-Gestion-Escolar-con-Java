      <g fill="#cfe9f5" stroke="#17324d" stroke-width="3">
        <rect x="138" y="152" width="36" height="34" rx="3"/><rect x="306" y="152" width="36" height="34" rx="3"/>
      </g>
      <g stroke="#17324d" stroke-width="2"><path d="M156 152v34M138 169h36M324 152v34M306 169h36"/></g>
