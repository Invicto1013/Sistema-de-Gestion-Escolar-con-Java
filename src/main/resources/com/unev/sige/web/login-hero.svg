    <linearGradient id="naranja" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e5531f"/><stop offset="1" stop-color="#ff8a55"/></linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#06121f" flood-opacity=".35"/></filter>
  </defs>
  <circle cx="230" cy="160" r="128" fill="#ffffff" opacity=".07"/>
  <circle cx="230" cy="160" r="92" fill="#ffffff" opacity=".07"/>
