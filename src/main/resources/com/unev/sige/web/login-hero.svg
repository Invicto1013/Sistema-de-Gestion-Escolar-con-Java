    <line x1="98" y1="188" x2="330" y2="188" stroke="#eef2f6" stroke-width="2"/>
    <line x1="98" y1="162" x2="330" y2="162" stroke="#eef2f6" stroke-width="2"/>
    <rect x="108" y="180" width="26" height="34" rx="6" fill="url(#barra)"/>
    <rect x="148" y="162" width="26" height="52" rx="6" fill="url(#barra)"/>
    <rect x="188" y="170" width="26" height="44" rx="6" fill="url(#barra)"/>
