  <path d="M96 87l4 4 8-9" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="122" y="77" width="86" height="8" rx="4" fill="#17324d"/>
  <rect x="122" y="91" width="56" height="6" rx="3" fill="#b9c7d4"/>
  <rect x="294" y="78" width="40" height="18" rx="9" fill="#e2f2f0"/><rect x="304" y="84" width="20" height="6" rx="3" fill="#0f766e"/>
