# Base MySQL LOCAL y desechable para las pruebas de integracion (puerto 3307, para no chocar con tu MySQL).
# Arrancar:  docker compose -f deploy/db-test/docker-compose.yml up -d --wait
# Detener y borrar datos:  docker compose -f deploy/db-test/docker-compose.yml down -v
services:
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sige_test
    ports:
      - "127.0.0.1:3307:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      # El esquema completo se carga solo la primera vez que arranca el contenedor.
      - ../../sql/sige_completo.sql:/docker-entrypoint-initdb.d/01-sige_completo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/mysql
